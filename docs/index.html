<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follower Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --page: #F2F2F4;
    --card: #FFFFFF;
    --ink: #0A0A0B;
    --muted: #6E6E73;
    --up: #188A32;
    --down: #C4122F;
    --ring: rgba(0, 0, 0, 0.06);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --avatar-bg: #E5E5EA;
  }
  :root[data-theme="dark"] {
    --page: #000000;
    --card: #1C1C1E;
    --ink: #FFFFFF;
    --muted: #A1A1A6;
    --up: #30D158;
    --down: #FF6961;
    --ring: rgba(255, 255, 255, 0.08);
    --shadow: none;
    --avatar-bg: #3A3A3C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 16px;
  }
  body.bare { background: transparent; }

  .grid {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
    max-width: 1100px;
    margin: 0 auto;
  }
  .grid .large { grid-column: 1 / -1; }

  .card {
    background: var(--card);
    border-radius: 28px;
    box-shadow: var(--shadow), 0 0 0 1px var(--ring);
    padding: 28px 30px 26px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .count {
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .label { font-size: 22px; font-weight: 400; margin-top: 6px; }

  .person { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
    background: var(--avatar-bg); object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: var(--muted);
  }
  .who { display: flex; flex-direction: column; min-width: 0; }
  .handle { font-weight: 700; font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name { color: var(--muted); font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .delta { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--muted); }
  .window { color: var(--muted); font-size: 18px; white-space: nowrap; }

  /* growth chart */
  .chart { margin-top: 24px; }
  .chart svg { display: block; width: 100%; height: 132px; overflow: visible; }
  .chart .axis { position: relative; height: 18px; margin-top: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .chart .axis span { position: absolute; top: 0; white-space: nowrap; transform: translateX(-50%); }
  .chart .axis span:first-child { transform: none; }
  .chart .axis span:last-child { transform: translateX(-100%); }
  .chart .pending, .reels .pending { color: var(--muted); font-size: 15px; }

  /* large card */
  .large .count { font-size: clamp(64px, 14vw, 120px); }
  .large .bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px; }
  .large .change { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
  .large .delta { font-size: 24px; }

  /* small card */
  .small .count { font-size: clamp(44px, 9vw, 58px); }
  .small .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .small .meta .label { margin-top: 0; }
  .small .delta { font-size: 20px; }
  .small .person { margin-top: 34px; }
  .small .avatar { width: 44px; height: 44px; font-size: 15px; }
  .small .handle { font-size: 18px; }
  .small .name { font-size: 16px; }

  /* engagement stat */
  .labelrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .stat { color: var(--muted); font-size: 16px; white-space: nowrap; }
  .stat b { color: var(--ink); font-weight: 600; }

  /* recent reels */
  .reels-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .reels-head .who { flex: 1; }
  .reels-title { font-weight: 700; font-size: 22px; }
  .reels-sub { color: var(--muted); font-size: 16px; }
  .reels-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
  .reels-stats .num { font-weight: 700; font-size: 28px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .reels-stats .cap { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .reel-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .reel { display: flex; flex-direction: column; gap: 8px; color: inherit; text-decoration: none; min-width: 0; }
  .reel:focus-visible { outline: 2px solid var(--up); outline-offset: 3px; border-radius: 16px; }
  .thumb { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: var(--avatar-bg); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .shade { position: absolute; inset: auto 0 0 0; height: 45%; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0)); }
  .thumb .views { position: absolute; left: 10px; bottom: 9px; color: #fff; font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
  .thumb .badge { position: absolute; top: 8px; left: 8px; background: var(--up); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 999px; }
  :root[data-theme="dark"] .thumb .badge { color: #000; }
  .reel-meta { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .reel-cap { font-size: 14px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  @media (max-width: 480px) {
    .reel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .reels-stats .num { font-size: 22px; }
  }

  @media (max-width: 480px) {
    body { padding: 10px; }
    .card { padding: 22px 22px 20px; border-radius: 24px; }
    .large .bottom { flex-direction: column; align-items: flex-start; }
    .large .change { align-items: flex-start; }
  }

  /* overview (view=overview): large card + 3-stat row */
  .ov-stats {
    display: grid; gap: 12px; margin-top: 26px; padding-top: 22px;
    border-top: 1px solid var(--ring);
  }
  .ov-stats .num { font-weight: 700; font-size: 28px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ov-stats .cap { color: var(--muted); font-size: 14px; margin-top: 2px; }

  /* single-stat tile (view=stat) */
  .tile { container-type: inline-size; padding: 20px 22px 18px; justify-content: space-between; gap: 12px; }
  .tile.fill { min-height: min(calc(100vh - 32px), 240px); }
  .tile-num {
    font-weight: 700; letter-spacing: -0.035em; line-height: 0.95;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    font-size: clamp(34px, 21cqw, 72px);
  }
  .tile-num.up { color: var(--up); }
  .tile-num.down { color: var(--down); }
  .tile-cap { color: var(--muted); font-size: clamp(14px, 6.5cqw, 18px); margin-top: 6px; line-height: 1.25; }
  .tile-who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tile-who .avatar { width: 26px; height: 26px; font-size: 10px; }
  .tile-who .handle { font-size: 14px; font-weight: 600; }

  /* top-reel spotlight (view=spotlight) */
  a.spot { color: inherit; text-decoration: none; transition: box-shadow .15s ease; }
  a.spot:hover { box-shadow: var(--shadow), 0 0 0 2px var(--ring); }
  a.spot:focus-visible { outline: 3px solid var(--up); outline-offset: 3px; }
  .spot-body { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 28px; align-items: start; }
  .spot .thumb { border-radius: 20px; }
  .spot .thumb .badge { top: 12px; left: 12px; font-size: 13px; }
  .spot-info { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .spot-kicker { color: var(--muted); font-size: 15px; font-weight: 500; }
  .spot-cap { font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .spot-date { color: var(--muted); font-size: 16px; }
  .spot-views { font-weight: 700; font-size: clamp(44px, 9vw, 64px); letter-spacing: -0.035em; line-height: 0.95; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .spot-views + .cap { color: var(--muted); font-size: 16px; margin-top: -8px; }
  .spot-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 12px; padding-top: 16px; border-top: 1px solid var(--ring); }
  .spot-stats .num { font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spot-stats .cap { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .spot-open { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .spot .pending { color: var(--muted); font-size: 16px; line-height: 1.5; }
  @media (max-width: 560px) {
    .spot-body { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .spot .thumb { max-width: 300px; width: 100%; }
    .spot-cap { font-size: 19px; }
  }
  @media (max-width: 480px) {
    .tile { padding: 16px 18px 14px; }
    .tile.fill { min-height: min(calc(100vh - 20px), 240px); }
    .ov-stats .num { font-size: 22px; }
  }

  .notice {
    max-width: 520px; margin: 40px auto; text-align: center;
    color: var(--muted); font-size: 16px; line-height: 1.5;
  }
</style>
</head>
<body>
<main id="root" aria-live="polite"></main>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var theme = params.get("theme") || "auto";
  var root = document.documentElement;
  function applyTheme() {
    var dark = theme === "dark" ||
      (theme === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "dark" : "light");
  }
  applyTheme();
  if (theme === "auto" && window.matchMedia) {
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  }
  if (params.get("bg") === "none") document.body.classList.add("bare");

  var wanted = (params.get("handle") || "").toLowerCase().split(",").map(function (s) {
    return s.trim().replace(/^@/, "");
  }).filter(Boolean);
  var size = params.get("size"); // "large" | "small" | null
  var mount = document.getElementById("root");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fmt(n) { return Number(n).toLocaleString("en-US"); }
  function signed(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n)); }
  function shortDate(iso) {
    var d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function change(acct) {
    if (acct.change7 != null) return { value: acct.change7, label: "within a week" };
    if (acct.history && acct.history.length > 1) {
      return { value: acct.changeSinceStart, label: "since " + shortDate(acct.trackingSince) };
    }
    return { value: null, label: "tracking started" };
  }

  function avatar(acct) {
    var initials = (acct.name || acct.handle || "?").split(/\s+/).map(function (w) { return w[0]; })
      .join("").slice(0, 2).toUpperCase();
    var fallback = el("div", "avatar", initials);
    fallback.setAttribute("aria-hidden", "true");
    if (!acct.picture) return fallback;
    var img = el("img", "avatar");
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.src = acct.picture;
    img.onerror = function () { img.replaceWith(fallback); };
    return img;
  }

  function person(acct) {
    var p = el("div", "person");
    p.appendChild(avatar(acct));
    var who = el("div", "who");
    who.appendChild(el("div", "handle", acct.handle));
    if (acct.name) who.appendChild(el("div", "name", acct.name));
    p.appendChild(who);
    return p;
  }

  function deltaNode(c) {
    if (c.value == null) return null;
    var cls = c.value > 0 ? "up" : c.value < 0 ? "down" : "flat";
    return el("div", "delta " + cls, signed(c.value));
  }

  var SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  // Daily follower line: one point per day from the snapshot history.
  function chart(acct) {
    var pts = (acct.history || []).slice(-(Number(params.get("days")) || 30));
    var wrap = el("div", "chart");
    if (pts.length < 2) {
      wrap.appendChild(el("div", "pending", "Growth chart starts after the second daily update."));
      return wrap;
    }
    var W = 600, H = 132, padT = 10, padB = 10;
    var vals = pts.map(function (p) { return p.followers; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    // Keep tiny changes (like +1 on 9,700) from looking like huge jumps.
    var minSpan = Math.max(10, hi * 0.02);
    if (hi - lo < minSpan) { var mid = (hi + lo) / 2; lo = mid - minSpan / 2; hi = mid + minSpan / 2; }
    var pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
    function x(i) { return (i / (pts.length - 1)) * W; }
    function y(v) { return padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB); }
    var trend = vals[vals.length - 1] - vals[0];
    var color = trend > 0 ? "var(--up)" : trend < 0 ? "var(--down)" : "var(--muted)";

    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", role: "img",
      "aria-label": "Daily followers from " + fmt(vals[0]) + " to " + fmt(vals[vals.length - 1]) + " over " + pts.length + " days" });
    var line = pts.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.followers).toFixed(1); }).join(" ");
    svg.appendChild(svgEl("path", { d: line + " L" + W + " " + H + " L0 " + H + " Z", fill: color, opacity: "0.12" }));
    svg.appendChild(svgEl("path", { d: line, fill: "none", stroke: color, "stroke-width": "3",
      "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" }));
    wrap.appendChild(svg);

    // Daily dots drawn as HTML so they stay round when the chart stretches.
    var dots = el("div");
    dots.style.cssText = "position:relative;height:0";
    pts.forEach(function (p, i) {
      if (pts.length > 14 && i !== pts.length - 1) return;
      var d = el("span");
      d.title = shortDate(p.date) + ": " + fmt(p.followers);
      d.style.cssText = "position:absolute;width:9px;height:9px;border-radius:50%;background:" + color +
        ";left:calc(" + (x(i) / W * 100) + "% - 4.5px);top:" + (y(p.followers) - H - 4.5) + "px";
      dots.appendChild(d);
    });
    wrap.appendChild(dots);

    var axis = el("div", "axis");
    var labelIdx = pts.length <= 7 ? pts.map(function (_, i) { return i; })
      : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    labelIdx.forEach(function (i) {
      var s = el("span", null, shortDate(pts[i].date));
      s.style.left = (x(i) / W * 100) + "%";
      axis.appendChild(s);
    });
    wrap.appendChild(axis);
    return wrap;
  }

  function largeCard(acct) {
    var card = el("article", "card large");
    card.setAttribute("aria-label", acct.handle + ", " + fmt(acct.followers) + " followers");
    card.appendChild(el("div", "count", fmt(acct.followers)));
    var labelRow = el("div", "labelrow");
    labelRow.appendChild(el("div", "label", "followers"));
    if (acct.engagement != null && params.get("stats") === "1") {
      var st = el("div", "stat");
      st.title = "Typical (median) likes + comments per post, divided by followers, last 12 posts";
      st.appendChild(el("b", null, (acct.engagement * 100).toFixed(1) + "%"));
      st.appendChild(document.createTextNode(" engagement"));
      labelRow.appendChild(st);
    }
    card.appendChild(labelRow);
    if (params.get("chart") !== "0") card.appendChild(chart(acct));
    var bottom = el("div", "bottom");
    bottom.appendChild(person(acct));
    var c = change(acct);
    var side = el("div", "change");
    var d = deltaNode(c);
    if (d) side.appendChild(d);
    side.appendChild(el("div", "window", c.label));
    bottom.appendChild(side);
    card.appendChild(bottom);
    return card;
  }

  function smallCard(acct) {
    var card = el("article", "card small");
    card.setAttribute("aria-label", acct.handle + ", " + fmt(acct.followers) + " followers");
    card.appendChild(el("div", "count", fmt(acct.followers)));
    var meta = el("div", "meta");
    meta.appendChild(el("div", "label", "followers"));
    var d = deltaNode(change(acct));
    if (d) meta.appendChild(d);
    card.appendChild(meta);
    card.appendChild(person(acct));
    return card;
  }

  function notice(text) {
    mount.innerHTML = "";
    mount.appendChild(el("p", "notice", text));
  }

  function compact(n) {
    if (n == null) return "—";
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
    if (n >= 1e4) return Math.round(n / 1e3) + "K";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }
  function postedDate(iso) {
    var d = new Date(iso.replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function playIcon() {
    var svg = svgEl("svg", { width: "14", height: "14", viewBox: "0 0 24 24", "aria-hidden": "true" });
    svg.appendChild(svgEl("path", { d: "M7 4.5v15l12-7.5z", fill: "currentColor" }));
    return svg;
  }

  function reelsCard(acct) {
    var reels = (acct.reels || []).slice(0, Number(params.get("count")) || 6);
    var card = el("article", "card reels");
    card.setAttribute("aria-label", "Recent reels for " + acct.handle);

    var head = el("div", "reels-head");
    head.appendChild(avatar(acct));
    var who = el("div", "who");
    who.appendChild(el("div", "reels-title", "Recent reels"));
    who.appendChild(el("div", "reels-sub", "@" + acct.handle));
    head.appendChild(who);
    card.appendChild(head);

    if (!reels.length) {
      card.appendChild(el("div", "pending", "No reels found yet. They appear after the next daily update."));
      return card;
    }

    var withViews = reels.filter(function (r) { return r.views != null; });
    var avg = withViews.length ? Math.round(withViews.reduce(function (t, r) { return t + r.views; }, 0) / withViews.length) : null;
    var monthAgo = Date.now() - 30 * 864e5;
    var top = null;
    (acct.reels || []).forEach(function (r) {
      var t = new Date(r.posted.replace(/([+-]\d\d)(\d\d)$/, "$1:$2")).getTime();
      if (t >= monthAgo && r.views != null && (!top || r.views > top.views)) top = r;
    });

    var stats = el("div", "reels-stats");
    [[compact(avg), "avg views, last " + withViews.length],
     [top ? compact(top.views) : "—", "top reel, 30 days"],
     [acct.engagement != null ? (acct.engagement * 100).toFixed(1) + "%" : "—", "engagement"]]
      .forEach(function (pair) {
        var b = el("div");
        b.appendChild(el("div", "num", pair[0]));
        b.appendChild(el("div", "cap", pair[1]));
        stats.appendChild(b);
      });
    card.appendChild(stats);

    var grid = el("div", "reel-grid");
    reels.forEach(function (r) {
      var a = el("a", "reel");
      a.href = r.link; a.target = "_blank"; a.rel = "noopener";
      a.setAttribute("aria-label", r.title + ", " + (r.views != null ? fmt(r.views) + " views" : "views unavailable"));
      var th = el("div", "thumb");
      if (r.thumb) {
        var img = el("img"); img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer"; img.src = r.thumb;
        img.onerror = function () { img.remove(); };
        th.appendChild(img);
      }
      th.appendChild(el("div", "shade"));
      if (top && r.id === top.id) th.appendChild(el("div", "badge", "Top"));
      var v = el("div", "views"); v.appendChild(playIcon()); v.appendChild(document.createTextNode(compact(r.views)));
      th.appendChild(v);
      a.appendChild(th);
      a.appendChild(el("div", "reel-cap", r.title));
      var meta = el("div", "reel-meta");
      meta.appendChild(el("span", null, postedDate(r.posted)));
      meta.appendChild(el("span", null, "♥ " + compact(r.likes) + "  ·  " + compact(r.comments)));
      a.appendChild(meta);
      grid.appendChild(a);
    });
    card.appendChild(grid);
    return card;
  }

  // ---- Shared reel numbers for the overview, stat and spotlight views ----
  function postedTime(iso) { return new Date(iso.replace(/([+-]\d\d)(\d\d)$/, "$1:$2")).getTime(); }
  function pct(f) { return (f * 100).toFixed(1) + "%"; }
  function reelNumbers(acct) {
    var reels = (acct.reels || []).filter(function (r) { return r.posted; }).slice()
      .sort(function (a, b) { return postedTime(b.posted) - postedTime(a.posted); });
    var last6 = reels.slice(0, 6).filter(function (r) { return r.views != null; });
    var monthAgo = Date.now() - 30 * 864e5;
    var recent = reels.filter(function (r) { return postedTime(r.posted) >= monthAgo; });
    var top = null;
    recent.forEach(function (r) { if (r.views != null && (!top || r.views > top.views)) top = r; });
    return {
      avg: last6.length ? Math.round(last6.reduce(function (t, r) { return t + r.views; }, 0) / last6.length) : null,
      avgCount: last6.length,
      top: top,
      posts30: acct.reels ? recent.length : null,
      // data.json only carries the newest few reels; if all of them are recent, the true count may be higher.
      posts30Capped: reels.length >= 9 && recent.length === reels.length
    };
  }

  // view=overview: the large card plus a row of reel stats.
  function overviewCard(acct) {
    var card = el("article", "card large overview");
    card.setAttribute("aria-label", acct.handle + " overview, " + fmt(acct.followers) + " followers");
    card.appendChild(el("div", "count", fmt(acct.followers)));
    card.appendChild(el("div", "label", "followers"));
    if (params.get("chart") !== "0") card.appendChild(chart(acct));
    var bottom = el("div", "bottom");
    bottom.appendChild(person(acct));
    var c = change(acct);
    var side = el("div", "change");
    var d = deltaNode(c);
    if (d) side.appendChild(d);
    side.appendChild(el("div", "window", c.label));
    bottom.appendChild(side);
    card.appendChild(bottom);

    var n = reelNumbers(acct);
    var items = [];
    if (n.avg != null) items.push([compact(n.avg), "avg views, last " + n.avgCount + (n.avgCount === 1 ? " reel" : " reels")]);
    if (n.top) items.push([compact(n.top.views), "top reel, 30 days"]);
    if (acct.engagement != null) items.push([pct(acct.engagement), "engagement"]);
    if (items.length) {
      var stats = el("div", "ov-stats");
      stats.style.gridTemplateColumns = "repeat(" + items.length + ", minmax(0, 1fr))";
      items.forEach(function (pair) {
        var b = el("div");
        b.appendChild(el("div", "num", pair[0]));
        b.appendChild(el("div", "cap", pair[1]));
        stats.appendChild(b);
      });
      card.appendChild(stats);
    }
    return card;
  }

  // view=stat&stat=NAME: one number in a compact tile.
  var STATS = {
    followers: function (a) { return { value: fmt(a.followers), caption: "followers" }; },
    growth7: function (a) {
      var c = change(a);
      if (c.value == null) return { value: "—", caption: "followers, tracking started" };
      return { value: signed(c.value), tone: c.value > 0 ? "up" : c.value < 0 ? "down" : "",
        caption: a.change7 != null ? "followers this week" : "followers " + c.label };
    },
    avgviews: function (a) {
      var n = reelNumbers(a);
      return n.avg == null ? { value: "—", caption: "avg views, no reels yet" }
        : { value: compact(n.avg), caption: "avg views, last " + n.avgCount + (n.avgCount === 1 ? " reel" : " reels") };
    },
    topreel: function (a) {
      var n = reelNumbers(a);
      return n.top ? { value: compact(n.top.views), caption: "views on top reel, 30 days" }
        : { value: "—", caption: "no reels in the last 30 days" };
    },
    engagement: function (a) {
      return a.engagement != null ? { value: pct(a.engagement), caption: "engagement" }
        : { value: "—", caption: "engagement, not available yet" };
    },
    posts30: function (a) {
      var n = reelNumbers(a);
      if (n.posts30 == null) return { value: "—", caption: "reels posted, 30 days" };
      return { value: fmt(n.posts30) + (n.posts30Capped ? "+" : ""),
        caption: (n.posts30 === 1 ? "reel" : "reels") + " posted, 30 days" };
    }
  };

  function statTile(acct, name, fill) {
    var s = STATS[name](acct);
    var card = el("article", "card tile" + (fill ? " fill" : ""));
    card.setAttribute("aria-label", "@" + acct.handle + ": " + s.value.replace("—", "no data") + " " + s.caption);
    var top = el("div");
    top.appendChild(el("div", "tile-num" + (s.tone ? " " + s.tone : ""), s.value));
    top.appendChild(el("div", "tile-cap", s.caption));
    card.appendChild(top);
    var who = el("div", "tile-who");
    var av = avatar(acct);
    who.appendChild(av);
    who.appendChild(el("div", "handle", "@" + acct.handle));
    card.appendChild(who);
    return card;
  }

  // view=spotlight: the most-viewed reel from the last 30 days.
  function spotlightCard(acct) {
    var top = reelNumbers(acct).top;
    if (!top) {
      var empty = el("article", "card large spot");
      empty.setAttribute("aria-label", "Top reel for " + acct.handle);
      var head = el("div", "reels-head");
      head.appendChild(avatar(acct));
      var who = el("div", "who");
      who.appendChild(el("div", "reels-title", "Top reel"));
      who.appendChild(el("div", "reels-sub", "@" + acct.handle + " · last 30 days"));
      head.appendChild(who);
      empty.appendChild(head);
      empty.appendChild(el("div", "pending", "No new reels in the last 30 days. The top one will show up here after the next reel is posted."));
      return empty;
    }
    var card = el("a", "card large spot");
    card.href = top.link; card.target = "_blank"; card.rel = "noopener";
    card.setAttribute("aria-label", "Top reel from @" + acct.handle + " in the last 30 days: " + (top.title || "untitled") +
      ". " + fmt(top.views) + " views. Opens on Instagram in a new tab.");

    var body = el("div", "spot-body");
    var th = el("div", "thumb");
    if (top.thumb) {
      var img = el("img"); img.alt = "Reel thumbnail"; img.referrerPolicy = "no-referrer"; img.src = top.thumb;
      img.onerror = function () { img.remove(); };
      th.appendChild(img);
    }
    th.appendChild(el("div", "badge", "Top reel"));
    body.appendChild(th);

    var info = el("div", "spot-info");
    var who2 = el("div", "tile-who");
    who2.appendChild(avatar(acct));
    who2.appendChild(el("div", "spot-kicker", "@" + acct.handle + " · top reel, last 30 days"));
    info.appendChild(who2);
    if (top.title) info.appendChild(el("div", "spot-cap", top.title));
    info.appendChild(el("div", "spot-date", "Posted " + new Date(postedTime(top.posted))
      .toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })));
    info.appendChild(el("div", "spot-views", fmt(top.views)));
    info.appendChild(el("div", "cap", "views"));
    var stats = el("div", "spot-stats");
    [[top.likes, "likes"], [top.comments, "comments"], [top.v7, "7-day views"]].forEach(function (pair) {
      if (pair[0] == null) return;
      var b = el("div");
      b.appendChild(el("div", "num", compact(pair[0])));
      b.appendChild(el("div", "cap", pair[1]));
      stats.appendChild(b);
    });
    if (stats.childNodes.length) info.appendChild(stats);
    var open = el("div", "spot-open", "Open on Instagram ↗");
    open.setAttribute("aria-hidden", "true");
    info.appendChild(open);
    body.appendChild(info);
    card.appendChild(body);
    return card;
  }

  function render(data) {
    var accounts = data.accounts || [];
    if (wanted.length) {
      accounts = wanted.map(function (h) {
        return accounts.find(function (a) { return a.handle.toLowerCase() === h; });
      }).filter(Boolean);
      if (!accounts.length) {
        notice("No data for @" + wanted.join(", @") + " yet. Check that the handle is in IG Accounts and marked Active. It appears after the next daily update.");
        return;
      }
    }
    if (!accounts.length) {
      notice("No accounts yet. They'll appear after the first daily update.");
      return;
    }
    var grid = el("div", "grid");
    var view = params.get("view");
    if (view === "stat") {
      var statName = (params.get("stat") || "followers").toLowerCase();
      if (!STATS[statName]) {
        notice("Unknown stat \"" + statName + "\". Use one of: " + Object.keys(STATS).join(", ") + ".");
        return;
      }
      accounts.forEach(function (acct) { grid.appendChild(statTile(acct, statName, accounts.length === 1)); });
      mount.innerHTML = "";
      mount.appendChild(grid);
      return;
    }
    if (view === "overview" || view === "spotlight") {
      accounts.forEach(function (acct) { grid.appendChild(view === "overview" ? overviewCard(acct) : spotlightCard(acct)); });
      mount.innerHTML = "";
      mount.appendChild(grid);
      return;
    }
    accounts.forEach(function (acct, i) {
      if (view === "reels") { grid.appendChild(reelsCard(acct)); grid.lastChild.classList.add("large"); return; }
      var big = size === "large" || (size !== "small" && (wanted.length === 1 || (!wanted.length && i === 0 && params.get("feature") === "first")));
      grid.appendChild(big ? largeCard(acct) : smallCard(acct));
    });
    mount.innerHTML = "";
    mount.appendChild(grid);
  }

  fetch("data.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function () { notice("No data yet. The first update runs on the next morning's schedule, or when you run it by hand from GitHub Actions."); });
})();
</script>
</body>
</html>
