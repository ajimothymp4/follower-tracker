<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follower Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --page: #F2F2F4;
    --card: #FFFFFF;
    --ink: #0A0A0B;
    --muted: #6E6E73;
    --up: #188A32;
    --down: #C4122F;
    --ring: rgba(0, 0, 0, 0.06);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --avatar-bg: #E5E5EA;
  }
  :root[data-theme="dark"] {
    --page: #000000;
    --card: #1C1C1E;
    --ink: #FFFFFF;
    --muted: #A1A1A6;
    --up: #30D158;
    --down: #FF6961;
    --ring: rgba(255, 255, 255, 0.08);
    --shadow: none;
    --avatar-bg: #3A3A3C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 16px;
  }
  body.bare { background: transparent; }

  .grid {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
    max-width: 1100px;
    margin: 0 auto;
  }
  .grid .large { grid-column: 1 / -1; }

  .card {
    background: var(--card);
    border-radius: 28px;
    box-shadow: var(--shadow), 0 0 0 1px var(--ring);
    padding: 28px 30px 26px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .count {
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .label { font-size: 22px; font-weight: 400; margin-top: 6px; }

  .person { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
    background: var(--avatar-bg); object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: var(--muted);
  }
  .who { display: flex; flex-direction: column; min-width: 0; }
  .handle { font-weight: 700; font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name { color: var(--muted); font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .delta { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--muted); }
  .window { color: var(--muted); font-size: 18px; white-space: nowrap; }

  /* growth chart */
  .chart { margin-top: 24px; }
  .chart svg { display: block; width: 100%; height: 132px; overflow: visible; }
  .chart .axis { position: relative; height: 18px; margin-top: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .chart .axis span { position: absolute; top: 0; white-space: nowrap; transform: translateX(-50%); }
  .chart .axis span:first-child { transform: none; }
  .chart .axis span:last-child { transform: translateX(-100%); }
  .chart .pending, .reels .pending { color: var(--muted); font-size: 15px; }

  /* large card */
  .large .count { font-size: clamp(64px, 14vw, 120px); }
  .large .bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px; }
  .large .change { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
  .large .delta { font-size: 24px; }

  /* small card */
  .small .count { font-size: clamp(44px, 9vw, 58px); }
  .small .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .small .meta .label { margin-top: 0; }
  .small .delta { font-size: 20px; }
  .small .person { margin-top: 34px; }
  .small .avatar { width: 44px; height: 44px; font-size: 15px; }
  .small .handle { font-size: 18px; }
  .small .name { font-size: 16px; }

  /* engagement stat */
  .labelrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .stat { color: var(--muted); font-size: 16px; white-space: nowrap; }
  .stat b { color: var(--ink); font-weight: 600; }

  /* recent reels */
  .reels-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .reels-head .who { flex: 1; }
  .reels-title { font-weight: 700; font-size: 22px; }
  .reels-sub { color: var(--muted); font-size: 16px; }
  .reels-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
  .reels-stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .reels-stats .num { font-weight: 700; font-size: 28px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .reels-stats .cap { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .reel-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .reel { display: flex; flex-direction: column; gap: 8px; color: inherit; text-decoration: none; min-width: 0; }
  .reel:focus-visible { outline: 2px solid var(--up); outline-offset: 3px; border-radius: 16px; }
  .thumb { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: var(--avatar-bg); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .shade { position: absolute; inset: auto 0 0 0; height: 45%; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0)); }
  .thumb .views { position: absolute; left: 10px; bottom: 9px; color: #fff; font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
  .thumb .badge { position: absolute; top: 8px; left: 8px; background: var(--up); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 999px; }
  :root[data-theme="dark"] .thumb .badge { color: #000; }
  .reel-meta { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .reel-cap { font-size: 14px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  /* overview &reels=N and view=reelgrid */
  .ov-reels { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--ring); }
  .ov-reels-title { font-weight: 700; font-size: 18px; margin-bottom: 14px; }
  .reelgrid { grid-column: 1 / -1; padding: 16px; }
  .reelgrid .pending { color: var(--muted); font-size: 15px; padding: 12px; }

  /* one-row layout (layout=row) */
  .reel-grid.row { grid-template-columns: repeat(var(--n), minmax(0, 1fr)) !important; }

  /* fit-to-frame (fit=1): the card fills the embed and the reel tiles resize to fit, no scrolling */
  html.fit, html.fit body { height: 100%; }
  html.fit body { overflow: hidden; display: flex; flex-direction: column; }
  html.fit #root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  html.fit .grid { flex: 1; min-height: 0; width: 100%; grid-template-rows: minmax(0, 1fr); }
  html.fit .grid > .card { min-height: 0; overflow: hidden; }
  html.fit .ov-reels { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .fitbox { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; }
  .fitbox .reel-grid { justify-content: center; }
  .reelgrid .fitbox { align-items: center; }
  .reel-grid.no-cap .reel-cap, .reel-grid.no-meta .reel-meta { display: none; }
  html.fit .reel-grid .thumb .views { font-size: clamp(11px, calc(var(--tw, 200px) * 0.12), 18px); left: 8px; bottom: 7px; }
  html.fit .reel-grid .thumb .views svg { width: clamp(9px, calc(var(--tw, 200px) * 0.09), 14px); }
  html.fit .reel-grid .thumb .badge { font-size: clamp(9px, calc(var(--tw, 200px) * 0.08), 12px); padding: 3px 7px; }
  html.fit .reel-grid .thumb { border-radius: clamp(8px, calc(var(--tw, 200px) * 0.1), 16px); }

  /* Instagram mark (logo=1): the full-color Instagram logo from docs/assets/, top-right of each card.
     Falls back to an "Instagram" label if the file can't load. */
  html.logo .grid > .card { position: relative; }
  .ig-mark { position: absolute; top: 24px; right: 26px; display: flex; align-items: center; pointer-events: none; }
  .ig-mark img { width: 24px; height: 24px; display: block; }
  .ig-mark span { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
  .tile .ig-mark { top: 16px; right: 16px; }
  .tile .ig-mark img { width: 18px; height: 18px; }
  .small .ig-mark { top: 20px; right: 22px; }
  html.logo .reelgrid { padding-top: 48px; }
  .reelgrid .ig-mark { top: 14px; right: 18px; }
  .reelgrid .ig-mark img { width: 20px; height: 20px; }
  html.logo .spot-kicker, html.logo .tile-cap { padding-right: 30px; }
  html.logo-text .spot-kicker { padding-right: 76px; }

  /* content view (view=content): last 30 days of posts, sortable */
  .content-controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 18px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .seg-label { color: var(--muted); font-size: 13px; margin-right: 2px; }
  .chip { font: inherit; font-size: 14px; font-weight: 500; min-height: 36px; padding: 0 13px; border-radius: 999px;
          border: 1px solid var(--ring); background: transparent; color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--up); outline-offset: 2px; }
  .content .pending { color: var(--muted); font-size: 15px; padding: 12px 0; }
  .grid > .content { grid-column: 1 / -1; }
  .thumb .kind { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.62); color: #fff; font-size: 11px;
                 font-weight: 600; padding: 3px 8px; border-radius: 999px; }
  .thumb .badge.rank { background: rgba(0,0,0,.62); color: #fff; }
  .thumb .badge.rank.podium { background: var(--up); }
  :root[data-theme="dark"] .thumb .badge.rank { color: #fff; }
  :root[data-theme="dark"] .thumb .badge.rank.podium { color: #000; }

  @media (max-width: 480px) {
    .reel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .reels-stats .num { font-size: 22px; }
    .reels-stats.four, .ov-stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; row-gap: 16px; }
  }

  /* Instagram mark (logo=1): the full-color Instagram logo from docs/assets/, top-right of each card.
     Falls back to an "Instagram" label if the file can't load. */
  html.logo .grid > .card { position: relative; }
  .ig-mark { position: absolute; top: 24px; right: 26px; display: flex; align-items: center; pointer-events: none; }
  .ig-mark img { width: 24px; height: 24px; display: block; }
  .ig-mark span { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
  .tile .ig-mark { top: 16px; right: 16px; }
  .tile .ig-mark img { width: 18px; height: 18px; }
  .small .ig-mark { top: 20px; right: 22px; }
  html.logo .reelgrid { padding-top: 48px; }
  .reelgrid .ig-mark { top: 14px; right: 18px; }
  .reelgrid .ig-mark img { width: 20px; height: 20px; }
  html.logo .spot-kicker, html.logo .tile-cap { padding-right: 30px; }
  html.logo-text .spot-kicker { padding-right: 76px; }

  @media (max-width: 480px) {
    body { padding: 10px; }
    .card { padding: 22px 22px 20px; border-radius: 24px; }
    .large .bottom { flex-direction: column; align-items: flex-start; }
    .large .change { align-items: flex-start; }
  }

  /* overview (view=overview): large card + 3-stat row */
  .ov-stats {
    display: grid; gap: 12px; margin-top: 26px; padding-top: 22px;
    border-top: 1px solid var(--ring);
  }
  .ov-stats .num { font-weight: 700; font-size: 28px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ov-stats .cap { color: var(--muted); font-size: 14px; margin-top: 2px; }

  /* single-stat tile (view=stat) */
  .tile { container-type: inline-size; padding: 20px 22px 18px; justify-content: space-between; gap: 12px; }
  .tile.fill { min-height: min(calc(100vh - 32px), 240px); }
  .tile-num {
    font-weight: 700; letter-spacing: -0.035em; line-height: 0.95;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    font-size: clamp(34px, 21cqw, 72px);
  }
  .tile-num.up { color: var(--up); }
  .tile-num.down { color: var(--down); }
  .tile-cap { color: var(--muted); font-size: clamp(14px, 6.5cqw, 18px); margin-top: 6px; line-height: 1.25; }
  .tile-who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tile-who .avatar { width: 26px; height: 26px; font-size: 10px; }
  .tile-who .handle { font-size: 14px; font-weight: 600; }

  /* top-reel spotlight (view=spotlight) */
  a.spot { color: inherit; text-decoration: none; transition: box-shadow .15s ease; }
  a.spot:hover { box-shadow: var(--shadow), 0 0 0 2px var(--ring); }
  a.spot:focus-visible { outline: 3px solid var(--up); outline-offset: 3px; }
  .spot-body { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 28px; align-items: start; }
  .spot .thumb { border-radius: 20px; }
  .spot .thumb .badge { top: 12px; left: 12px; font-size: 13px; }
  .spot-info { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .spot-kicker { color: var(--muted); font-size: 15px; font-weight: 500; }
  .spot-cap { font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .spot-date { color: var(--muted); font-size: 16px; }
  .spot-views { font-weight: 700; font-size: clamp(44px, 9vw, 64px); letter-spacing: -0.035em; line-height: 0.95; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .spot-views + .cap { color: var(--muted); font-size: 16px; margin-top: -8px; }
  .spot-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 12px; padding-top: 16px; border-top: 1px solid var(--ring); }
  .spot-stats .num { font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spot-stats .cap { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .spot-open { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .spot .pending { color: var(--muted); font-size: 16px; line-height: 1.5; }
  @media (max-width: 560px) {
    .spot-body { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .spot .thumb { max-width: 300px; width: 100%; }
    .spot-cap { font-size: 19px; }
  }
  /* Instagram mark (logo=1): the full-color Instagram logo from docs/assets/, top-right of each card.
     Falls back to an "Instagram" label if the file can't load. */
  html.logo .grid > .card { position: relative; }
  .ig-mark { position: absolute; top: 24px; right: 26px; display: flex; align-items: center; pointer-events: none; }
  .ig-mark img { width: 24px; height: 24px; display: block; }
  .ig-mark span { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
  .tile .ig-mark { top: 16px; right: 16px; }
  .tile .ig-mark img { width: 18px; height: 18px; }
  .small .ig-mark { top: 20px; right: 22px; }
  html.logo .reelgrid { padding-top: 48px; }
  .reelgrid .ig-mark { top: 14px; right: 18px; }
  .reelgrid .ig-mark img { width: 20px; height: 20px; }
  html.logo .spot-kicker, html.logo .tile-cap { padding-right: 30px; }
  html.logo-text .spot-kicker { padding-right: 76px; }

  @media (max-width: 480px) {
    .tile { padding: 16px 18px 14px; }
    .tile.fill { min-height: min(calc(100vh - 20px), 240px); }
    .ov-stats .num { font-size: 22px; }
  }

  .notice {
    max-width: 520px; margin: 40px auto; text-align: center;
    color: var(--muted); font-size: 16px; line-height: 1.5;
  }
</style>
</head>
<body>
<main id="root" aria-live="polite"></main>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var theme = params.get("theme") || "auto";
  var root = document.documentElement;
  function applyTheme() {
    var dark = theme === "dark" ||
      (theme === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "dark" : "light");
  }
  applyTheme();
  if (theme === "auto" && window.matchMedia) {
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  }
  if (params.get("bg") === "none") document.body.classList.add("bare");

  var wanted = (params.get("handle") || "").toLowerCase().split(",").map(function (s) {
    return s.trim().replace(/^@/, "");
  }).filter(Boolean);
  var size = params.get("size"); // "large" | "small" | null
  var mount = document.getElementById("root");
  var rowLayout = params.get("layout") === "row";
  var fitMode = params.get("fit") === "1";
  var logoMode = params.get("logo") === "1";
  if (logoMode) document.documentElement.classList.add("logo");
  // The Instagram logo file (full-color icon), shown as-is on light and dark cards.
  var LOGO_SOURCES = ["assets/instagram-logo.svg"];
  // How many reels a view shows: the link's value, else 3 in a one-row layout, else the view's default.
  function reelCount(raw, def) {
    var n = Number(raw);
    return n > 0 ? Math.min(n, 12) : (rowLayout ? 3 : def);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fmt(n) { return Number(n).toLocaleString("en-US"); }
  function signed(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n)); }
  function shortDate(iso) {
    var d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function change(acct) {
    if (acct.change7 != null) return { value: acct.change7, label: "within a week" };
    if (acct.history && acct.history.length > 1) {
      return { value: acct.changeSinceStart, label: "since " + shortDate(acct.trackingSince) };
    }
    return { value: null, label: "tracking started" };
  }

  function avatar(acct) {
    var initials = (acct.name || acct.handle || "?").split(/\s+/).map(function (w) { return w[0]; })
      .join("").slice(0, 2).toUpperCase();
    var fallback = el("div", "avatar", initials);
    fallback.setAttribute("aria-hidden", "true");
    if (!acct.picture) return fallback;
    var img = el("img", "avatar");
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.src = acct.picture;
    img.onerror = function () { img.replaceWith(fallback); };
    return img;
  }

  function person(acct) {
    var p = el("div", "person");
    p.appendChild(avatar(acct));
    var who = el("div", "who");
    who.appendChild(el("div", "handle", acct.handle));
    if (acct.name) who.appendChild(el("div", "name", acct.name));
    p.appendChild(who);
    return p;
  }

  function deltaNode(c) {
    if (c.value == null) return null;
    var cls = c.value > 0 ? "up" : c.value < 0 ? "down" : "flat";
    return el("div", "delta " + cls, signed(c.value));
  }

  var SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  // Daily follower line: one point per day from the snapshot history.
  function chart(acct) {
    var pts = (acct.history || []).slice(-(Number(params.get("days")) || 30));
    var wrap = el("div", "chart");
    if (pts.length < 2) {
      wrap.appendChild(el("div", "pending", "Growth chart starts after the second daily update."));
      return wrap;
    }
    var W = 600, H = 132, padT = 10, padB = 10;
    var vals = pts.map(function (p) { return p.followers; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    // Keep tiny changes (like +1 on 9,700) from looking like huge jumps.
    var minSpan = Math.max(10, hi * 0.02);
    if (hi - lo < minSpan) { var mid = (hi + lo) / 2; lo = mid - minSpan / 2; hi = mid + minSpan / 2; }
    var pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
    function x(i) { return (i / (pts.length - 1)) * W; }
    function y(v) { return padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB); }
    var trend = vals[vals.length - 1] - vals[0];
    var color = trend > 0 ? "var(--up)" : trend < 0 ? "var(--down)" : "var(--muted)";

    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", role: "img",
      "aria-label": "Daily followers from " + fmt(vals[0]) + " to " + fmt(vals[vals.length - 1]) + " over " + pts.length + " days" });
    var line = pts.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.followers).toFixed(1); }).join(" ");

  // Newest reels first, plus the most-viewed reel from the last 30 days (for the "Top" badge).

  // ---- Shared reel numbers for the overview, stat and spotlight views ----
  function postedTime(iso) { return new Date(iso.replace(/([+-]\d\d)(\d\d)$/, "$1:$2")).getTime(); }
  function pct(f) { return (f * 100).toFixed(1) + "%"; }
  // Average views of reels posted in the last 30 days. The nightly job computes it from up to
  // 40 recent posts; older data files fall back to the reels the widget has.
  function avg30(acct) {
    if (acct.avg30 != null) return acct.avg30;
    var since = Date.now() - 30 * 864e5;
    var v = (acct.reels || []).filter(function (r) { return r.views != null && postedTime(r.posted) >= since; });
    return v.length ? Math.round(v.reduce(function (t, r) { return t + r.views; }, 0) / v.length) : null;
  }
  function reelNumbers(acct) {
    var reels = (acct.reels || []).filter(function (r) { return r.posted; }).slice()
      .sort(function (a, b) { return postedTime(b.posted) - postedTime(a.posted); });
    var last6 = reels.slice(0, 6).filter(function (r) { return r.views != null; });
    var monthAgo = Date.now() - 30 * 864e5;
    var recent = reels.filter(function (r) { return postedTime(r.posted) >= monthAgo; });
    var top = null;
    recent.forEach(function (r) { if (r.views != null && (!top || r.views > top.views)) top = r; });
    return {
      avg: last6.length ? Math.round(last6.reduce(function (t, r) { return t + r.views; }, 0) / last6.length) : null,
      avgCount: last6.length,
      top: top,
      posts30: acct.reels30 != null ? acct.reels30 : acct.reels ? recent.length : null,
      // Older data files only carry the newest few reels; if all of them are recent, the true count may be higher.

  // ---- fit=1: size the reel tiles so the whole card fits the embed without scrolling ----
  // Tries every column count (or one row) and each detail level (caption + date, date only,
  // thumbnail only), and keeps the biggest tiles that still fit the space left in the card.
  var TILE_RATIO = 4 / 3, TILE_GAP = 12;
  var DETAIL_LEVELS = [
    { extra: 70, min: 140, cls: "" },              // caption (2 lines) + date/likes
    { extra: 26, min: 120, cls: "no-cap" },         // date/likes only (needs room for "Nov 11  ♥ 1K · 10")
    { extra: 0, min: 0, cls: "no-cap no-meta" }     // thumbnail + views
  ];
  function layoutGrid(grid, box) {
    var n = grid.children.length;
    if (!n) return;
    var W = box.clientWidth, H = box.clientHeight;
    var levels = grid.dataset.details === "0" ? DETAIL_LEVELS.slice(2) : DETAIL_LEVELS;
    var pick = null;
    for (var li = 0; li < levels.length; li++) {
      var lv = levels[li], best = null;
      for (var cols = rowLayout ? n : 1; cols <= n; cols++) {
        var rows = Math.ceil(n / cols);
        var byW = (W - (cols - 1) * TILE_GAP) / cols;
        var byH = ((H - (rows - 1) * TILE_GAP) / rows - lv.extra) / TILE_RATIO;
        var w = Math.floor(Math.min(byW, byH));
        if (!best || w > best.w) best = { cols: cols, w: w, cls: lv.cls };
      }
      pick = best;
      if (best.w >= lv.min) break;
    }
    var w = Math.max(pick.w, 36);
    grid.classList.remove("no-cap", "no-meta");
    pick.cls.split(" ").forEach(function (c) { if (c) grid.classList.add(c); });
    grid.classList.remove("row");
    grid.style.gridTemplateColumns = "repeat(" + pick.cols + ", " + w + "px)";
    grid.style.setProperty("--tw", w + "px");
  }
  // ---- logo=1: Instagram mark in the top-right corner of each card ----
  function addLogos() {
    Array.prototype.forEach.call(mount.querySelectorAll(".grid > .card"), function (card) {
      var mark = el("div", "ig-mark");
      var img = el("img");
      var sources = LOGO_SOURCES.slice();
      img.alt = "Instagram";
      img.onerror = function () {
        if (sources.length) { img.src = sources.shift(); return; }
        img.replaceWith(el("span", null, "Instagram"));
        document.documentElement.classList.add("logo-text");
      };
      img.src = sources.shift();
      mark.appendChild(img);
      card.appendChild(mark);
    });
  }

  function applyFit() {
    var cards = mount.querySelectorAll(".grid > .card");
    if (cards.length !== 1) return;                 // fit only applies to a single card
    var grids = cards[0].querySelectorAll(".reel-grid");
    if (!grids.length) return;
    document.documentElement.classList.add("fit");
    Array.prototype.forEach.call(grids, function (grid) {
      if (grid.parentNode.classList.contains("fitbox")) {   // already in a sized box (content view)
        layoutGrid(grid, grid.parentNode);
        return;
      }
      var box = el("div", "fitbox");
      grid.parentNode.insertBefore(box, grid);
      box.appendChild(grid);
      var run = function () { layoutGrid(grid, box); };
      run();
      if (window.ResizeObserver) new ResizeObserver(run).observe(box);
      else window.addEventListener("resize", run);
    });
  }

  // ---- view=content: every post from the last 30 days, sortable and filterable ----
  var CONTENT_SORTS = [["views", "Views"], ["likes", "Likes"], ["comments", "Comments"], ["engagement", "Engagement"], ["newest", "Newest"]];
  var CONTENT_TYPES = [["all", "All"], ["reel", "Reels"], ["post", "Photos & carousels"]];
  function pickOption(list, value, def) {
    return list.some(function (o) { return o[0] === value; }) ? value : def;
  }
  function contentCard(acct) {
    var items = acct.content || [];
    var state = { sort: pickOption(CONTENT_SORTS, params.get("sort"), "views"),
                  type: pickOption(CONTENT_TYPES, params.get("type"), "all") };
    var card = el("article", "card content");
    card.setAttribute("aria-label", "Last 30 days of posts from " + acct.handle);

    var head = el("div", "reels-head");
    head.appendChild(avatar(acct));
    var who = el("div", "who");
    who.appendChild(el("div", "reels-title", "Last 30 days"));
    who.appendChild(el("div", "reels-sub", "@" + acct.handle + " · " + items.length + " post" + (items.length === 1 ? "" : "s")));
    head.appendChild(who);
    card.appendChild(head);

    if (!acct.content) {
      card.appendChild(el("div", "pending", "Posts appear here after the next daily update."));
      return card;
    }

    var sum = function (k) { return items.reduce(function (t, r) { return t + (r[k] || 0); }, 0); };
    var reelViews = items.filter(function (r) { return r.views != null; });
    var stats = el("div", "reels-stats four");
    [[String(items.length), "posts"],
     [reelViews.length ? compact(sum("views")) : "—", "reel views"],
     [compact(sum("likes")), "likes"],
     [compact(sum("comments")), "comments"]].forEach(function (pair) {
      var b = el("div");
      b.appendChild(el("div", "num", pair[0]));
      b.appendChild(el("div", "cap", pair[1]));
      stats.appendChild(b);
    });
    card.appendChild(stats);

    var controls = el("div", "content-controls");
    function segment(label, list, key) {
      var seg = el("div", "seg");
      seg.setAttribute("role", "group");
      seg.setAttribute("aria-label", label);
      seg.appendChild(el("span", "seg-label", label));
      list.forEach(function (o) {
        var b = el("button", "chip", o[1]);
        b.type = "button";
        b.setAttribute("aria-pressed", String(state[key] === o[0]));
        b.addEventListener("click", function () {
          state[key] = o[0];
          Array.prototype.forEach.call(seg.querySelectorAll(".chip"), function (c) { c.setAttribute("aria-pressed", "false"); });
          b.setAttribute("aria-pressed", "true");
          draw();
        });
        seg.appendChild(b);
      });
      return seg;
    }
    controls.appendChild(segment("Sort by", CONTENT_SORTS, "sort"));
    controls.appendChild(segment("Show", CONTENT_TYPES, "type"));
    card.appendChild(controls);

    var wrap = el("div", "content-grid-wrap");
    card.appendChild(wrap);
    if (fitMode) {
      wrap.classList.add("fitbox");
      if (window.ResizeObserver) new ResizeObserver(function () {
        if (wrap.firstChild && wrap.firstChild.classList.contains("reel-grid")) layoutGrid(wrap.firstChild, wrap);
      }).observe(wrap);
    }
    var limit = Number(params.get("count")) || 0;
    var score = {
      views: function (r) { return r.views != null ? r.views : -1; },
      likes: function (r) { return r.likes || 0; },
      comments: function (r) { return r.comments || 0; },
      engagement: function (r) { return (r.likes || 0) + (r.comments || 0); },
      newest: function (r) { return postedTime(r.posted); }
    };
    function draw() {
      var list = items.filter(function (r) {
        return state.type === "all" || (state.type === "reel" ? r.type === "reel" : r.type !== "reel");
      });
      list.sort(function (a, b) {
        return (score[state.sort](b) - score[state.sort](a)) || (score.likes(b) - score.likes(a));
      });
      if (limit > 0) list = list.slice(0, limit);
      wrap.innerHTML = "";
      if (!list.length) {
        wrap.appendChild(el("div", "pending", state.type === "reel" ? "No reels in the last 30 days."
          : state.type === "post" ? "No photos or carousels in the last 30 days." : "No posts in the last 30 days."));
        return;
      }
      var g = reelGrid(list, null, params.get("details") !== "0", { rank: state.sort !== "newest" });
      wrap.appendChild(g);
      if (fitMode && document.documentElement.classList.contains("fit")) layoutGrid(g, wrap);
    }
    draw();
    return card;
  }

  function render(data) {
    var accounts = data.accounts || [];
    if (wanted.length) {
      accounts = wanted.map(function (h) {
        return accounts.find(function (a) { return a.handle.toLowerCase() === h; });
      }).filter(Boolean);
      if (!accounts.length) {
        notice("No data for @" + wanted.join(", @") + " yet. Check that the handle is in IG Accounts and marked Active. It appears after the next daily update.");
        return;
      }
    }
    if (!accounts.length) {
      notice("No accounts yet. They'll appear after the first daily update.");
      return;
    }
    var grid = el("div", "grid");
    var view = params.get("view");
    if (view === "stat") {
      var statName = (params.get("stat") || "followers").toLowerCase();
      if (!STATS[statName]) {
        notice("Unknown stat \"" + statName + "\". Use one of: " + Object.keys(STATS).join(", ") + ".");
        return;
      }
      accounts.forEach(function (acct) { grid.appendChild(statTile(acct, statName, accounts.length === 1)); });
      mount.innerHTML = "";
      mount.appendChild(grid);
      if (logoMode) addLogos();
      return;
    }
    if (view === "overview" || view === "spotlight" || view === "reelgrid" || view === "content") {
      accounts.forEach(function (acct) {
        grid.appendChild(view === "overview" ? overviewCard(acct) : view === "spotlight" ? spotlightCard(acct)
          : view === "content" ? contentCard(acct) : reelGridCard(acct));
      });
      mount.innerHTML = "";
      mount.appendChild(grid);
      if (logoMode) addLogos();
      if (fitMode) applyFit();
      return;
    }
    accounts.forEach(function (acct, i) {
      if (view === "reels") { grid.appendChild(reelsCard(acct)); grid.lastChild.classList.add("large"); return; }
      var big = size === "large" || (size !== "small" && (wanted.length === 1 || (!wanted.length && i === 0 && params.get("feature") === "first")));
      grid.appendChild(big ? largeCard(acct) : smallCard(acct));
    });
    mount.innerHTML = "";
    mount.appendChild(grid);
    if (logoMode) addLogos();
    if (fitMode) applyFit();
  }

  fetch("data.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function () { notice("No data yet. The first update runs on the next morning's schedule, or when you run it by hand from GitHub Actions."); });
})();
</script>
</body>
</html>
