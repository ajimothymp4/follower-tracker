name: Daily Instagram snapshot

on:
  schedule:
    # Several early-morning attempts, because GitHub often starts scheduled runs late.
    # Each run is safe to repeat: it just refreshes today's numbers. Times are Indianapolis
    # standard time (UTC-5); during daylight time (March-November) they run one hour later.
    - cron: "7 6 * * *"     # 1:07 AM
    - cron: "37 7 * * *"    # 2:37 AM
    - cron: "7 9 * * *"     # 4:07 AM
    - cron: "37 10 * * *"   # 5:37 AM
  workflow_dispatch:         # lets you run it any time from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: follower-tracker
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take snapshot
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          IG_USER_ID: "17841401665501406"
          NOTION_ACCOUNTS_DB: "7f8bee63d83a4e3087d27d6b5a7a0067"
          NOTION_SNAPSHOTS_DB: "ec89d5102a6943f59cd3e69fb76bb143"
          NOTION_REELS_DB: "c0324a6cc4544393b59a5c5edf9f32cf"
        run: python tracker.py

      - name: Save data for the widget
        if: always()
        run: |
          git config user.name "follower-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Snapshot $(date -u +%F)" && git push)

      - name: Refresh the widget site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages refresh request skipped"
